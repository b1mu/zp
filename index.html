let ac;function bp(f,d=.12,ty='sine'){if(!S.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain();o.type=ty;o.frequency.value=f;v.gain.value=.07;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
M.addEventListener('click',e=>{if(e.target.tagName=='BUTTON')bp(520,.05)});
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let joy=null,jv={x:0,y:0};
c.addEventListener('pointerdown',e=>{joy={x:e.offsetX,y:e.offsetY,cx:e.offsetX,cy:e.offsetY,id:e.pointerId};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;joy.cx=e.offsetX;joy.cy=e.offsetY;let dx=joy.cx-joy.x,dy=joy.cy-joy.y,l=Math.hypot(dx,dy);if(l>60){joy.x=joy.cx-dx/l*60;joy.y=joy.cy-dy/l*60;dx=joy.cx-joy.x;dy=joy.cy-joy.y;l=60}jv=l>10?{x:dx/60,y:dy/60}:{x:0,y:0}});
['pointerup','pointercancel'].forEach(n=>c.addEventListener(n,()=>{joy=null;jv={x:0,y:0}}));

const NM=['Waikiki Shore','Hanauma Bay','North Shore','Diamond Head','Hilo Banyan Grove','Kona Coffee Farm','Waimea Canyon','Nā Pali Coast','Haleakalā Crater','Kīlauea Lava Fields','Molokai Midnight','The Final Luau'];
const THI=[0,0,1,0,1,2,1,2,2,3,2,3],NL=NM.length;
const TH=[{s:['#2aa5b8','#4fc6d2','#8fe3e0'],sd:'#f1dca0',g1:'#6db857',g2:'#5cab4c',pa:'#e6cf8e'},
{s:['#c6684a','#e08a5a','#f3b97a'],sd:'#f0c48a',g1:'#8aa04a',g2:'#7a9040',pa:'#e0b878',tint:'rgba(255,120,40,.18)'},
{s:['#16496b','#1e6a8a','#3a8fa8'],sd:'#a9a28a',g1:'#3d7a4a',g2:'#336a40',pa:'#968f78',dk:.85},
{s:['#5a2a2a','#7a3a30','#a8503a'],sd:'#4a3a35',g1:'#3a2f2c',g2:'#2e2523',pa:'#5a4a44',tint:'rgba(255,60,0,.2)',dk:.55}];
const LAB=['Beach Hut','Lighthouse','Research Lab','Luau Tent'],TT=['Maya’s Journal','Keeper’s Logbook','Kane’s Lab Notes','Luau Guest Book'],OR=['FIRST','SECOND','THIRD','FOURTH'];
const ST=['Day 3. Everyone who used Dr. Kane’s free “sunscreen” turned. I overheard his boat code:','Midnight: I saw Kane’s boat dumping glowing crates. He muttered that','Formula X was meant to cure sunburn. I made it worse on purpose, so the resorts would pay anything for the cure. My notes say','A torn page in Kane’s handwriting says'];
const DF=[.7,1,1.35],ZM=[1.25,1,.8];
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const obs=[],trees=[],flowers=[],clues=[];
let lv=0,L=3,code=[],th=TH[0],P={x:0,y:0,a:0},Z=[],hp=3,mx=3,inv=0,found=[],ui=true,cool=0,last=0,flash=0,mode='menu',cam={x:CX,y:CY};
function ex(d){let k=rnd()*3|0;if(d<2&&k==0)k=1;if(k==0){const a=1+(rnd()*(d-1)|0);return a+' + '+(d-a)}
 if(k==1){const b=1+(rnd()*5|0);return(d+b)+' − '+b}
 const f=[1,2,3,4,5,6,7,8,9].filter(n=>d%n==0),p=f[rnd()*f.length|0];return p+' × '+d/p}
function build(i){seed=11+i*97;obs.length=trees.length=flowers.length=clues.length=0;rocks.length=BL.length=FP.length=0;th=TH[THI[i]];L=i<4?3:4;code=[];
 for(let k=0;k<L;k++){code.push(1+(rnd()*9|0));
  let x,y,t=0;do{const a=rnd()*6.283,r=.4+rnd()*.4;x=CX+Math.cos(a)*RX*r;y=CY+Math.sin(a)*RY*r}
  while(++t<300&&(Math.hypot(x-560,y-620)<260||(x>520&&Math.abs(y-600)<100)||clues.some(q=>Math.hypot(x-q.x,y-q.y)<280)));
  clues.push({x,y,b:LAB[k],n:TT[k],t:ST[k]+' the <b>'+OR[k]+' digit is '+ex(code[k])+'</b>.'});obs.push({x,y:y-58,r:k==1?36:44})}
 for(let n=0;n<500&&trees.length<70;n++){const a=rnd()*6.283,r=Math.sqrt(rnd())*.88,x=CX+Math.cos(a)*RX*r,y=CY+Math.sin(a)*RY*r;
  if(Math.hypot(x-560,y-620)<110||(x>480&&Math.abs(y-600)<50)||clues.some(q=>Math.hypot(x-q.x,y-q.y)<110||Math.hypot(x-q.x,y-q.y+58)<110)||trees.some(t=>Math.hypot(x-t.x,y-t.y)<70))continue;
  trees.push({x,y,a:rnd()*6});obs.push({x,y,r:16})}
 for(let n=0;n<90;n++){const a=rnd()*6.283,r=Math.sqrt(rnd())*.85;flowers.push({x:CX+Math.cos(a)*RX*r,y:CY+Math.sin(a)*RY*r,c:rnd()<.5?'#ff5c8a':'#ffd23f'})}genExtra()}
function init(){P={x:560,y:620,a:0};mx=3+(S.df==0);hp=Math.max(1,mx-hpP);inv=0;Z=[];
 for(let i=0;i<4+lv+nz;i++){let x,y;do{const a=rnd()*6.283,r=Math.sqrt(rnd())*.85;x=CX+Math.cos(a)*RX*r;y=CY+Math.sin(a)*RY*r}while(Math.hypot(x-P.x,y-P.y)<380);Z.push({x,y,a:rnd()*6,sp:0,t:0,ph:rnd()*9})}hud()}
function hud(){$('hp').textContent='♥'.repeat(hp)+'♡'.repeat(mx-hp)+'  Lv '+(lv+1);$('cl').textContent='Clues '+found.length+'/'+L+'  🔎'+mini.filter(m=>m.got).length+'/'+mini.length}
function show(h,cls){M.className=cls||'';M.innerHTML=h;M.style.display='flex';ui=true}
function close(){M.style.display='none';ui=false;last=performance.now()}
function modal(h,b,cb){show('<div class="p">'+h+'<button id="mb">'+b+'</button></div>');$('mb').onclick=()=>{close();cb&&cb()}}
function go(i,keep){lv=i;build(i);if(!keep)found=[];init();nz=hpP=0;mode='play';$('h').style.display='flex';hud();
 modal('<h2>Level '+(i+1)+': '+NM[i]+'</h2><p>Find <b>'+L+' clues</b>, crack the <b>'+L+'-digit code</b>, then reach the boat at the east dock. Slow zombies shuffle everywhere.</p>','Go!')}
function menu(){mode='menu';$('h').style.display='none';build(0);init();P={x:-999,y:-999,a:0};const n=Math.min(S.u,NL);
 show('<div id="t">🌴 ZOMBIE<br>PAPPA 🧟</div><div id="st">Crack the code. Dodge the dead. Escape paradise.</div><button class="bt pl" id="b1">▶ Play Level '+n+'</button><button class="bt" id="b2">Levels</button><button class="bt" id="b3">Settings</button><button class="bt" id="b4">How to Play</button><div id="sc">★ '+S.s.reduce((a,b)=>a+(b||0),0)+' / '+NL*3+'</div>','menu');
 $('b1').onclick=()=>start(n-1);$('b2').onclick=lvls;$('b3').onclick=()=>sets(menu);
 $('b4').onclick=()=>{show('<div class="p"><h2>How to Play</h2><p>🧭 Move with WASD, arrows, or drag a finger.</p><p>🔎 Walk onto glowing rings to read clues. Each clue hides one digit of the boat code as a small sum.</p><p>🚤 Reach the end of the dock and enter the code.</p><p>🧟 Zombies bite and cost a heart. Hearts left = stars. Four survivors will turn one by one, and you decide how to stop them. Later levels have night, lava and more zombies.</p><button id="bk">Back</button></div>');$('bk').onclick=menu}}
function lvls(){show('<div class="p"><h2>Choose Level</h2><div id="lg"></div><button id="bk">Back</button></div>');$('bk').onclick=menu;
 for(let i=0;i<NL;i++){const b=document.createElement('button'),u=i<S.u,s=S.s[i]||0;b.disabled=!u;b.innerHTML=u?(i+1)+'<br><small>'+'★'.repeat(s)+'☆'.repeat(3-s)+'</small>':'🔒';b.onclick=()=>start(i);$('lg').appendChild(b)}}
function sets(back){const a=['Easy','Normal','Hard'],z=['Close','Normal','Far'];
 show('<div class="p"><h2>Settings</h2><button class="o" id="s1">Difficulty: '+a[S.df]+'</button><button class="o" id="s2">Sound: '+(S.snd?'On':'Off')+'</button><button class="o" id="s3">Camera zoom: '+z[S.zm]+'</button><button class="o" id="s4">Reset progress</button><button id="bk">Back</button></div>');
 $('s1').onclick=()=>{S.df=(S.df+1)%3;sv();sets(back)};$('s2').onclick=()=>{S.snd^=1;sv();sets(back)};$('s3').onclick=()=>{S.zm=(S.zm+1)%3;sv();sets(back)};
 $('s4').onclick=()=>{if($('s4').dataset.s){S.u=1;S.s=[];S.tt={};S.ch={};S.sn=0;sv();sets(back)}else{$('s4').dataset.s=1;$('s4').textContent='Tap again to confirm'}};$('bk').onclick=back}
function pause(){show('<div class="p"><h2>Paused</h2><button class="o" id="p1">Resume</button><button class="o" id="p2">Restart level</button><button class="o" id="p3">Settings</button><button class="o" id="p4">Main menu</button></div>');
 $('p1').onclick=close;$('p2').onclick=()=>start(lv);$('p3').onclick=()=>sets(pause);$('p4').onclick=menu}
$('pb').onclick=()=>{if(mode=='play'&&!ui)pause()};
$('nb').onclick=()=>{if(mode=='play'&&!ui)modal('<h2>Notes</h2>'+(found.length?found.map(i=>'<p><b>'+clues[i].n+'</b><br>'+clues[i].t+'</p>').join('')+hn.map(h=>'<p>💡 '+h+'</p>').join(''):'<p>No clues yet. Find the glowing rings.</p>'),'Close')};
function keypad(){let v='';show('<div class="p"><h2>Boat Keypad</h2><div id="d"></div><div id="k"></div><div id="e"></div><button id="bk">Step back</button></div>');
 const d=$('d'),e=$('e'),up=()=>d.textContent=(v+'____').slice(0,L).split('').join(' ');
 '123456789C0✓'.split('').forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.onclick=()=>{
  if(ch=='C')v='';else if(ch=='✓'){if(v==code.join(''))return win();e.textContent='Wrong code. Check your notes.';bp(150,.2,'sawtooth');v=''}else if(v.length<L)v+=ch;up()};$('k').appendChild(b)});
 up();$('bk').onclick=()=>{close();cool=3}}
function win(){bp(523,.12);setTimeout(()=>bp(659,.12),130);setTimeout(()=>bp(784,.25),260);S.s[lv]=Math.max(S.s[lv]||0,hp>3?3:hp);S.u=Math.max(S.u,Math.min(NL,lv+2));sv();
 const st='★'.repeat(hp>3?3:hp)+'☆'.repeat(3-(hp>3?3:hp));
 if(lv<NL-1)modal('<h2>Escaped! '+st+'</h2><p>The boat roars away from '+NM[lv]+'. Next stop: <b>'+NM[lv+1]+'</b>.</p>','Next level',()=>camp(lv));
 else camp(11,()=>cut(END,()=>modal('<h2>You win! '+st+'</h2><p>Dr. Kane’s plan is exposed: he spread the virus on purpose to sell the cure to the resorts. Paradise is safe again!</p>','Main menu',menu)))}
function lose(){bp(110,.4,'sawtooth');modal('<h2>You were bitten!</h2><p>Your clues are safe in your notes.</p>','Try again',()=>start(lv,1))}

function mv(o,dx,dy,r,dock){o.x+=dx;o.y+=dy;
 if(dock&&o.x>1440&&Math.abs(o.y-600)<40)o.y=Math.max(578,Math.min(622,o.y));
 if(dock&&o.x>1400&&Math.abs(o.y-600)<=24){o.x=Math.min(o.x,1545)}
 else{const s=Math.hypot((o.x-CX)/(RX-r-20),(o.y-CY)/(RY-r-20));if(s>1){o.x=CX+(o.x-CX)/s;o.y=CY+(o.y-CY)/s}}
 for(const b of obs){const ex=o.x-b.x,ey=o.y-b.y,d=Math.hypot(ex,ey),m=b.r+r;if(d<m&&d>0){o.x=b.x+ex/d*m;o.y=b.y+ey/d*m}}}
function update(dt){const pl=mode=='play';fx(dt);
 if(pl){let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jv.x,iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jv.y;
  const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}if(l>.05){P.a=Math.atan2(iy,ix);mv(P,ix*150*dt,iy*150*dt,12,true);P.wk=(P.wk||0)+dt*11;P.st=(P.st||0)+150*dt;if(P.st>30){P.st=0;FP.push({x:P.x,y:P.y,a:P.a,t:0,s:FP.length%2?5:-5});if(FP.length>50)FP.shift()}}
  inv-=dt;cool-=dt;flash-=dt}
 const ch=(34+lv*3.5)*DF[S.df],wd=16*DF[S.df];
 for(const z of Z){const d=pl?Math.hypot(P.x-z.x,P.y-z.y):999;let sp;
  if(d<230){if(!z.g){z.g=1;bp(70+z.ph*6,.4,'sawtooth')}z.a=Math.atan2(P.y-z.y,P.x-z.x);sp=ch}
  else{z.g=0;z.t-=dt;if(z.t<=0){z.t=1+rnd()*2;z.a=rnd()*6.283;z.sp=rnd()<.35?0:wd}sp=z.sp}
  mv(z,Math.cos(z.a)*sp*dt,Math.sin(z.a)*sp*dt,13,false);
  if(pl&&d<26&&inv<=0){hp--;inv=1.8;flash=.3;shake=.4;BL.push({x:P.x,y:P.y,r:12+rnd()*10,a:rnd()*6});bp(160,.15,'sawtooth');mv(P,Math.cos(z.a)*40,Math.sin(z.a)*40,12,true);hud();if(hp<=0)return lose()}}
 if(!pl)return;
 clues.forEach((q,i)=>{if(!found.includes(i)&&Math.hypot(P.x-q.x,P.y-q.y)<40){found.push(i);hud();bp(880,.15);modal('<h2>'+q.n+'</h2><p>'+q.t+'</p><p><i>Clue '+found.length+' of '+L+' saved to Notes.</i></p>','Got it')}});
 mini.forEach(m=>{if(!m.got&&Math.hypot(P.x-m.x,P.y-m.y)<26){m.got=1;bp(740,.1);toast((m.h?'💡 ':'🔎 ')+m.t);if(m.h&&!hn.includes(m.t))hn.push(m.t);hud()}});
 if(cool<=0&&Math.hypot(P.x-DOCK.x,P.y-DOCK.y)<30)keypad()}
const rocks=[],tufts=[],PT=[],FP=[],BL=[],CLD=[],RD=[],RN=[0,0,0,0,1,0,1,0,1,0,1,1];
const lc=document.createElement('canvas'),lg=lc.getContext('2d');
let shake=0,lt=0,cz=1,zz=1,CUT=null,cutT=0,bars=0,amb;
